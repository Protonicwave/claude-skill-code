[dependency-groups]
# Pinned so a new release cannot change what the gates report.
dev = ["coverage==7.15.4", "mypy==2.3.1", "pytest==9.1.1", "ruff==0.16.9", "vulture==2.16"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["engineer/scripts"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["engineer/scripts", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "S", "PT", "N", "C90", "PLR"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
# pytest's assertion rewriting relies on bare assert, and test tables use literal values.
# The tests run git from PATH with an argument list, as the scripts do.
"tests/**" = ["S101", "PLR2004", "S603", "S607"]
# git is resolved from PATH on purpose, and every call passes an argument list, never a shell string.
"engineer/scripts/**" = ["S603", "S607"]

[tool.mypy]
strict = true
mypy_path = "engineer/scripts"
